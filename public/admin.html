<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05060d">
<title>BeRail · Admin</title>
<link rel="icon" href="/icon-180.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="app" class="admin">
  <section id="login" class="screen" style="display:flex;align-items:center;justify-content:center;padding:30px 18px">
    <form class="auth-wrap" id="loginForm">
      <div class="brand"><span class="brand-dot"></span>BeRail</div>
      <p class="auth-tag">Espace admin. Entre ton mot de passe admin.</p>
      <div class="auth-form">
        <label class="field"><span>Mot de passe admin</span><input id="key" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" id="loginBtn">Entrer</button>
        <p class="error hidden" id="loginErr"></p>
      </div>
      <p class="auth-foot">Le serveur gratuit peut mettre jusqu'à une minute à se réveiller.</p>
    </form>
  </section>
  <section id="dash" class="screen hidden">
    <header class="topbar">
      <div class="topbar-left"><span class="logo-sm">BeRail</span><span class="chip">Admin</span></div>
      <div class="topbar-right"><button class="chip" id="reload">↻ Actualiser</button><button class="chip" id="logout">Quitter</button></div>
    </header>
    <main id="main"></main>
  </section>
</div>
<div class="modal hidden" id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
