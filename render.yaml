services:
  - type: web
    name: berail
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ_NAME
        value: Europe/Paris
      - key: PURGE_HOUR
        value: "23"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: berail-data
      mountPath: /var/data
      sizeGB: 1
